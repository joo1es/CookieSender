<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 400px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }
        h3 {
            margin: 0 0 12px 0;
            color: #333;
            font-size: 14px;
        }
        .tab-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .tab-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 10px;
        }
        .tab-item:hover {
            background: #f0f0f0;
        }
        .tab-item.selected {
            background: #e3f2fd;
        }
        .tab-item img {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .tab-item .title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            color: #333;
        }
        .tab-item .url {
            font-size: 11px;
            color: #999;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 140px;
            flex-shrink: 0;
        }
        .tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .tag-list {
            background: #e3f2fd;
            color: #1565c0;
        }
        .tag-detail {
            background: #fff3e0;
            color: #e65100;
        }
        .status {
            margin-top: 10px;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 12px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <h3>虫洞</h3>
    <div class="tab-list" id="tabList"></div>
    <div id="status" class="status"></div>
    <script src="popup.js"></script>
</body>
</html>
